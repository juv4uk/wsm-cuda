name: Local GPU runner witness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/local-gpu-runner.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/local-gpu-runner.yml"

jobs:
  cuda-witness:
    # Standard GitHub-hosted Ubuntu has no NVIDIA GPU. This hardware test
    # must fail closed until a GitHub-hosted GPU larger runner is provisioned.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CUDA_HOME: /usr/local/cuda-12.6
      CUDA_PATH: /usr/local/cuda-12.6
      LD_LIBRARY_PATH: /usr/lib/wsl/lib:/usr/local/cuda-12.6/targets/x86_64-linux/lib
    steps:
      - name: Require GitHub-hosted GPU (no local machines)
        shell: bash
        run: |
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted || { echo "::error::Self-hosted execution forbidden"; exit 1; }
          command -v nvidia-smi >/dev/null 2>&1 || { echo "::error::No GPU on standard GitHub-hosted runner; hardware witness cannot run"; exit 1; }
          nvidia-smi --query-gpu=name --format=csv,noheader

      - uses: actions/checkout@v4

      - name: Probe shared WSL CUDA worker
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/dxg
          /usr/lib/wsl/lib/nvidia-smi             --query-gpu=name,driver_version,memory.total,compute_cap             --format=csv,noheader
          command -v wsm-gpu
          wsm-gpu ensure

      - name: Hand a real CUDA task to the persistent worker
        shell: bash
        run: |
          set -euo pipefail
          before="$(wsm-gpu ping)"
          echo "$before"

          wsm-gpu submit add-one             --count 4194304             --iterations 64

          after="$(wsm-gpu ping)"
          echo "$after"

          before_pid="$(sed -n 's/.* pid=\([^ ]*\).*/\1/p' <<<"$before")"
          after_pid="$(sed -n 's/.* pid=\([^ ]*\).*/\1/p' <<<"$after")"
          test -n "$before_pid"
          test "$before_pid" = "$after_pid"
          echo "WSM_CUDA_SHARED_WORKER_GREEN pid=$after_pid"
